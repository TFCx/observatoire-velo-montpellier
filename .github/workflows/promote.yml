name: Promote

# Lancé à la main depuis l'onglet Actions (ADR 0004) :
# - beta reçoit montpellier/main ;
# - prod ne reçoit que ce qui est déjà sur montpellier/beta.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement à mettre à jour
        type: choice
        options:
          - beta
          - prod
        required: true

concurrency:
  group: promote-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      SOURCE_BRANCH: ${{ inputs.environment == 'beta' && 'montpellier/main' || 'montpellier/beta' }}
      TARGET_BRANCH: montpellier/${{ inputs.environment }}
      # Inscrit dans le site généré (build-info.ts) : la version n'est visible qu'hors prod.
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}

    steps:
      - name: Checkout the branch to promote
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      # Refuse tout ce qui n'est pas un fast-forward : l'environnement ne peut qu'avancer
      # vers un commit qui contient déjà tout ce qui y est déployé.
      - name: Check that the promotion is a fast-forward
        run: |
          if ! git merge-base --is-ancestor "origin/${TARGET_BRANCH}" HEAD; then
            echo "::error::${TARGET_BRANCH} n'est pas un ancêtre de ${SOURCE_BRANCH} : promotion refusée."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -- --run

      - name: Run smoke tests on generated site
        run: npm run test:smoke

      # Alias "beta" et non "montpellier-beta" : ce dernier est le sous-domaine réservé au déploiement
      # de branche natif de Netlify pour montpellier/beta, qui garde la priorité sur un alias du même nom.
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: |
          commit=$(git rev-parse --short HEAD)
          if [ "${{ inputs.environment }}" = "prod" ]; then
            npx --yes netlify-cli@27.10.0 deploy --no-build --dir=.output/public --prod \
              --message="prod <- ${commit}"
          else
            npx --yes netlify-cli@27.10.0 deploy --no-build --dir=.output/public \
              --alias=beta --message="beta <- ${commit}"
          fi

      # La branche n'avance qu'une fois le déploiement réussi : elle indique ce qui est en ligne.
      - name: Move the environment branch to the deployed commit
        run: git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
